
[Items]
	#Enable cape animation for the Apprentice Mage Robe.
	enableApprenticeMageRobeCapeAnimation = true
	#Show Spellgun ammo HUD near the crosshair.
	enableSpellgunAmmoHud = true
	#Render the Mana Force Blade sheath on your hip when the blade is in your hotbar.
	#Always disabled in Epic Fight environments.
	enableManaForceBladeHotbarSheathRendering = true
	#Render temporary block tremors when Smashcast Scepter smash attacks hit.
	enableSmashcastScepterTremorBlockRendering = true
	#Epic Fight weapon categories that suppress the Scrollcaster Gauntlet's extra offhand visual rendering.
	#This affects only the client-side visual workaround and does not change combat behavior.
	#Examples: UCHIGATANA, TACHI, GREATSWORD.
	scrollcasterGauntletOffhandVisualDisabledMainhandCategories = ["UCHIGATANA"]
	#Main-hand item IDs that suppress the Scrollcaster Gauntlet's extra offhand visual rendering.
	#Use this for weapons that share a broad Epic Fight category with unrelated items.
	#Default entries cover vanilla crossbow, Iron's Autoloader Crossbow, and Multipurpose Staffrifle.
	scrollcasterGauntletOffhandVisualDisabledMainhandItems = ["minecraft:crossbow", "irons_spellbooks:autoloader_crossbow", "apprenticecodex:multipurpose_staffrifle"]

[Blocks]
	#Disable Essence Smoker particle texture analysis and always use fallback colors.
	disableEssenceSmokerParticleTextureAnalysis = false

